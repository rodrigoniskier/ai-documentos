services:
  - type: web
    name: rn-document-platform
    runtime: python
    region: virginia
    plan: starter
    buildCommand: bash ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rn-document-platform-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,rn-document-platform.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://rn-document-platform.onrender.com"
      - key: PUBLIC_BASE_URL
        value: "https://rn-document-platform.onrender.com"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: SUPPORT_EMAIL
        value: rncontentlab@gmail.com
      - key: TERMS_VERSION
        value: "2026-07-25"
      - key: PRIVACY_VERSION
        value: "2026-07-25"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_QUERYSTRING_AUTH
        value: "true"
      - key: AWS_QUERYSTRING_EXPIRE
        value: "600"
      - key: ASAAS_ENABLED
        value: "false"
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_BASE_URL
        value: "https://api.asaas.com/v3"
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: ASAAS_CHECKOUT_EXPIRATION_MINUTES
        value: "60"
      - key: ASAAS_HTTP_TIMEOUT
        value: "60"
      - key: ASAAS_BILLING_TYPES
        value: "CREDIT_CARD"
      - key: ASAAS_WEBHOOK_NAME
        value: "RN DocumentAI — Asaas Produção"
      - key: ASAAS_WEBHOOK_EMAIL
        value: "rncontentlab@gmail.com"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"

databases:
  - name: rn-document-platform-db
    region: virginia
    plan: basic-256mb
    databaseName: rndocument
    user: rndocument
    ipAllowList: []
